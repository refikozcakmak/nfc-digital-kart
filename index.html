<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dijital Kart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .card {
            max-width: 420px;
            margin: 40px auto;
            background: white;
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .profile {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #ddd;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            margin: 5px 0;
            font-size: 28px;
        }

        .job {
            color: #777;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            display: block;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            background: #111;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.85;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">
            👤
        </div>

        <h1>Ahmet Yılmaz</h1>

        <div class="job">
            Grafik Tasarımcı
        </div>

        <div class="buttons">

            <a class="button" href="tel:+905551112233">
                📞 Beni Ara
            </a>

            <a class="button" href="https://wa.me/905551112233">
                💬 WhatsApp
            </a>

            <a class="button" href="https://instagram.com">
                📷 Instagram
            </a>

            <a class="button" href="mailto:ornek@mail.com">
                ✉️ E-posta
            </a>

            <a class="button" href="#">
                🌐 Web Sitesi
            </a>

        </div>

        <div class="footer">
            Dijital Kart
        </div>

    </div>

</body>
</html>
