        /* =====================================================
           GENEL
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:

                radial-gradient(
                    circle at 80% 0%,
                    rgba(220,0,0,.16),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 0% 100%,
                    rgba(255,255,255,.04),
                    transparent 30%
                ),

                #050505;

            color: #fff;

            overflow-x: hidden;
        }



        /* =====================================================
           XLINE AÇILIŞ EKRANI
        ===================================================== */

        #intro {

            position: fixed;

            inset: 0;

            z-index: 99999;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #030303;

            animation:
                introExit
                .9s
                cubic-bezier(.7,0,.2,1)
                3.15s
                forwards;
        }


        /* Kırmızı atmosfer */

        #intro::before {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background:

                radial-gradient(
                    circle,
                    rgba(220,0,0,.20),
                    rgba(220,0,0,.06) 35%,
                    transparent 70%
                );

            filter: blur(8px);

            animation:
                redPulse
                2.8s
                ease-in-out
                infinite;
        }



        /* İnce lazer */

        .scan-line {

            position: absolute;

            left: -20%;

            top: -10%;

            width: 2px;

            height: 120%;

            background:

                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(255,0,0,.9),
                    #fff,
                    rgba(255,0,0,.9),
                    transparent
                );

            box-shadow:

                0 0 15px
                rgba(255,0,0,.8),

                0 0 50px
                rgba(255,0,0,.5);

            transform:
                rotate(12deg);

            animation:
                scan
                1.25s
                cubic-bezier(.4,0,.2,1)
                .15s
                forwards;
        }



        /* Ortadan geçen ışık */

        .light-line {

            position: absolute;

            width: 0;

            height: 1px;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            background: #e00000;

            box-shadow:

                0 0 10px
                #e00000,

                0 0 30px
                rgba(224,0,0,.8);

            animation:
                horizontalLine
                1.2s
                cubic-bezier(.2,.8,.2,1)
                .35s
                forwards;
        }



        /* Açılış içeriği */

            position: relative;

            z-index: 5;

                introContent
